<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineGen - Create Video</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Space Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Space Grotesk', 'sans-serif'],
          },
          colors: {
            brand: {
              primary: '#8b5cf6',
              accent: '#38bdf8',
            },
            surface: {
              darkest: '#0e0e10',
              dark: '#131315',
              container: '#1c1b1d',
              elevated: '#28272a',
              border: '#39393b',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0e0e10;
      color: #f3f4f6;
      font-family: 'Space Grotesk', sans-serif;
    }
  </style>
</head>
<body class="min-h-screen bg-[#0e0e10] text-gray-100 flex justify-center pb-28">

  <!-- Mobile Container -->
  <main class="w-full max-w-md min-h-screen flex flex-col bg-[#131315] shadow-2xl relative border-x border-[#1c1b1d]">
    
    <!-- Top Header / App Bar -->
    <header class="flex items-center justify-between px-5 py-4 border-b border-[#1c1b1d] sticky top-0 bg-[#131315]/90 backdrop-blur-md z-40">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-violet-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-violet-500/20">
          <svg class="w-4 h-4 text-white fill-current" viewBox="0 0 24 24">
            <polygon points="5,3 19,12 5,21"></polygon>
          </svg>
        </div>
        <span class="font-bold tracking-wider text-base text-white">CINEGEN</span>
      </div>
      <div class="w-8 h-8 rounded-full bg-violet-500/20 border border-violet-400/30 flex items-center justify-center text-violet-300">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
        </svg>
      </div>
    </header>

    <div class="p-5 flex flex-col gap-6 flex-1">
      
      <!-- Unlimited Free Status Badge -->
      <div class="bg-cyan-950/40 border border-cyan-500/30 rounded-xl px-4 py-2.5 flex items-center justify-center gap-2 text-cyan-400 text-xs font-semibold tracking-wide">
        <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
        </svg>
        <span>UNLIMITED FREE • NO LOGIN • NO CREDITS LIMIT</span>
      </div>

      <!-- Prompt Input Section -->
      <section class="flex flex-col gap-2">
        <div class="flex items-center justify-between">
          <label class="text-sm font-semibold flex items-center gap-1.5 text-gray-200">
            <span class="text-violet-400">✦</span> Video Prompt
          </label>
          <button type="button" class="text-xs bg-[#28272a] hover:bg-[#39393b] text-gray-300 border border-[#39393b] px-3 py-1 rounded-full flex items-center gap-1 transition">
            <span class="text-violet-400">✦</span> Enhance AI
          </button>
        </div>
        <textarea 
          rows="3" 
          placeholder="Describe your cinematic masterpiece in detail (e.g., A futuristic cyberpunk street in Tokyo during heavy neon rain, cinematic lighting, 8k)..." 
          class="w-full bg-[#1c1b1d] border border-[#28272a] rounded-xl p-3.5 text-sm text-gray-200 placeholder-gray-500 focus:outline-none focus:border-violet-500 focus:ring-1 focus:ring-violet-500 transition resize-none"
        ></textarea>
      </section>

      <!-- Aspect Ratio -->
      <section class="flex flex-col gap-2">
        <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Aspect Ratio</span>
        <div class="grid grid-cols-2 gap-3">
          <!-- 16:9 Selected -->
          <button type="button" class="p-4 rounded-xl bg-violet-900/30 border-2 border-violet-500 flex flex-col items-center justify-center gap-1 text-center transition">
            <svg class="w-6 h-6 text-violet-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <rect x="2" y="5" width="20" height="14" rx="2" stroke-width="2"></rect>
            </svg>
            <span class="text-sm font-bold text-violet-200">16:9 Widescreen</span>
            <span class="text-[11px] text-violet-300/80">Cinematic & YouTube</span>
          </button>

          <!-- 9:16 Vertical -->
          <button type="button" class="p-4 rounded-xl bg-[#1c1b1d] border border-[#28272a] hover:border-gray-600 flex flex-col items-center justify-center gap-1 text-center transition">
            <svg class="w-5 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <rect x="5" y="2" width="14" height="20" rx="2" stroke-width="2"></rect>
            </svg>
            <span class="text-sm font-semibold text-gray-300">9:16 Vertical</span>
            <span class="text-[11px] text-gray-500">Reels & Shorts</span>
          </button>
        </div>
      </section>

      <!-- Duration -->
      <section class="bg-[#1c1b1d] border border-[#28272a] rounded-xl p-4 flex flex-col gap-3">
        <div class="flex items-center justify-between">
          <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Duration</span>
          <span class="text-xs font-bold px-2 py-0.5 rounded bg-cyan-950 text-cyan-400 border border-cyan-800">3 Minutes</span>
        </div>
        <input 
          type="range" 
          min="1" 
          max="4" 
          value="2" 
          class="w-full accent-cyan-400 cursor-pointer h-1.5 bg-[#28272a] rounded-lg"
        >
        <div class="flex justify-between text-[11px] text-gray-400 font-medium">
          <span class="text-cyan-400">10s (Quick)</span>
          <span>1 Min</span>
          <span>5 Min</span>
          <span>10 Min (Max)</span>
        </div>
      </section>

      <!-- Render Quality -->
      <section class="flex flex-col gap-2">
        <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Render Quality</span>
        <div class="grid grid-cols-2 gap-3">
          <button type="button" class="py-3 px-4 rounded-xl bg-[#1c1b1d] border border-[#28272a] text-sm font-semibold text-gray-300 hover:border-gray-600 flex items-center justify-center gap-2 transition">
            <span class="px-1.5 py-0.5 text-[10px] bg-cyan-900/60 text-cyan-300 border border-cyan-700/60 rounded">HD</span> 4K Ultra HD
          </button>
          <button type="button" class="py-3 px-4 rounded-xl bg-violet-900/40 border-2 border-violet-500 text-sm font-bold text-violet-200 flex items-center justify-center gap-2 transition">
            <span class="px-1.5 py-0.5 text-[10px] bg-violet-800 text-white rounded">8K</span> 8K Cinema
          </button>
        </div>
      </section>

      <!-- Hindi Voice Model -->
      <section class="flex flex-col gap-2">
        <div class="flex items-center justify-between">
          <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Hindi Voice Model</span>
          <a href="settings.html" class="text-xs text-cyan-400 hover:underline">Optional Dubbing</a>
        </div>
        
        <div class="flex flex-col gap-2">
          <!-- Voice 1 -->
          <label class="flex items-center justify-between p-3 rounded-xl bg-[#1c1b1d] border border-violet-500/40 cursor-pointer">
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 rounded-full bg-cyan-950/60 text-cyan-400 border border-cyan-800/60 flex items-center justify-center">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
              </div>
              <div>
                <p class="text-sm font-semibold text-white">Aarav (Natural Male)</p>
                <p class="text-xs text-gray-400">Deep, expressive, dramatic tone</p>
              </div>
            </div>
            <input type="radio" name="voice" checked class="accent-violet-500 w-4 h-4">
          </label>

          <!-- Voice 2 -->
          <label class="flex items-center justify-between p-3 rounded-xl bg-[#1c1b1d] border border-[#28272a] hover:border-gray-600 cursor-pointer">
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 rounded-full bg-cyan-950/60 text-cyan-400 border border-cyan-800/60 flex items-center justify-center">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
              </div>
              <div>
                <p class="text-sm font-semibold text-white">Ananya (Natural Female)</p>
                <p class="text-xs text-gray-400">Warm, clear, emotional storytelling</p>
              </div>
            </div>
            <input type="radio" name="voice" class="accent-violet-500 w-4 h-4">
          </label>

          <!-- Voice 3 -->
          <label class="flex items-center justify-between p-3 rounded-xl bg-[#1c1b1d] border border-[#28272a] hover:border-gray-600 cursor-pointer">
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 rounded-full bg-violet-950/60 text-violet-400 border border-violet-800/60 flex items-center justify-center">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>
              </div>
              <div>
                <p class="text-sm font-semibold text-white">Cinematic Narrator Hindi</p>
                <p class="text-xs text-gray-400">Epic trailer style, booming presence</p>
              </div>
            </div>
            <input type="radio" name="voice" class="accent-violet-500 w-4 h-4">
          </label>
        </div>
      </section>

      <!-- Vault & Direct Export -->
      <section class="bg-[#1c1b1d] border border-[#28272a] rounded-xl p-4 flex flex-col gap-3">
        <div class="flex items-center justify-between">
          <div>
            <h4 class="text-xs font-semibold text-white">Vault & Direct Export</h4>
            <p class="text-[11px] text-gray-400">Auto-Save to 4K/8K Vault</p>
          </div>
          <span class="text-xs text-cyan-400 font-medium">Auto-Save Enabled</span>
        </div>
        <div class="grid grid-cols-2 gap-2.5 pt-1">
          <button type="button" class="py-2.5 px-3 rounded-lg bg-[#28272a] hover:bg-[#39393b] border border-[#39393b] text-xs font-semibold text-gray-200 flex items-center justify-center gap-1.5 transition">
            <svg class="w-3.5 h-3.5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
            Export 4K
          </button>
          <button type="button" class="py-2.5 px-3 rounded-lg bg-[#28272a] hover:bg-[#39393b] border border-[#39393b] text-xs font-semibold text-gray-200 flex items-center justify-center gap-1.5 transition">
            <svg class="w-3.5 h-3.5 text-violet-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
            Export 8K
          </button>
        </div>
      </section>

      <!-- Generate Video CTA Button -->
      <a href="generating.html" class="w-full py-4 rounded-2xl bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white font-bold text-center flex items-center justify-center gap-2 shadow-lg shadow-violet-600/30 active:scale-[0.99] transition mt-2">
        <svg class="w-5 h-5 text-violet-200 fill-current" viewBox="0 0 24 24">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
        <span>Generate Video (Free)</span>
      </a>

    </div>

    <!-- Fixed Bottom Tab Bar -->
    <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-[#131315]/95 backdrop-blur-lg border-t border-[#1c1b1d] px-6 py-2.5 flex items-center justify-around z-50">
      <!-- Create (Active) -->
      <a href="index.html" class="flex flex-col items-center gap-1 text-cyan-400">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path>
        </svg>
        <span class="text-[11px] font-semibold">Create</span>
      </a>

      <!-- Library -->
      <a href="library.html" class="flex flex-col items-center gap-1 text-gray-500 hover:text-gray-300 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
        </svg>
        <span class="text-[11px] font-medium">Library</span>
      </a>

      <!-- Settings -->
      <a href="settings.html" class="flex flex-col items-center gap-1 text-gray-500 hover:text-gray-300 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
        </svg>
        <span class="text-[11px] font-medium">Settings</span>
      </a>
    </nav>

  </main>
</body>
</html>
